<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion de stock - Pharmacie</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f9fa; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px 14px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #2c3e50; color: white; }
        .tag { display: inline-block; background: #e0f0ff; color: #205072; border-radius: 10px; padding: 2px 8px; margin: 2px; font-size: 12px; }
    </style>
</head>
<body>
<h1>Stock de la pharmacie</h1>
<table>
    <thead>
    <tr>
        <th>Nom</th><th>Description</th><th>Prix (DH)</th><th>Code-barre</th>
        <th>Expiration</th><th>Catégorie</th><th>Fournisseur</th><th>Fabricant</th><th>Tags</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="produit : ${produits}">
        <td th:text="${produit.nom}">Nom</td>
        <td th:text="${produit.description}">Description</td>
        <td th:text="${produit.prix}">0.00</td>
        <td th:text="${produit.codeBarre}">CODE</td>
        <td th:text="${produit.dateExpiration}">2026-01-01</td>
        <td th:text="${produit.categorie != null ? produit.categorie.nom : '-'}">Catégorie</td>
        <td th:text="${produit.fournisseur != null ? produit.fournisseur.nom : '-'}">Fournisseur</td>
        <td th:text="${produit.detailProduit != null ? produit.detailProduit.fabricant : '-'}">Fabricant</td>
        <td><span class="tag" th:each="tag : ${produit.tags}" th:text="${tag.libelle}">tag</span></td>
    </tr>
    </tbody>
</table>
</body>
</html>
